name: AI 語音音檔
on:
  workflow_dispatch:
    inputs:
      list:
        description: '要做的清單（sample = 試聽 20 句；all = 全站）'
        default: sample
permissions:
  contents: write
jobs:
  tts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 產生音檔
        env:
          KEY: ${{ secrets.AZURE_SPEECH_KEY }}
          REGION: ${{ secrets.AZURE_SPEECH_REGION }}
          LIST: ${{ github.event.inputs.list }}
        run: |
          cat > /tmp/gen.py <<'PY'
          import json, os, sys, time, html, urllib.request, urllib.error, functools
          print = functools.partial(print, flush=True)
          key, region, lst = os.environ['KEY'].strip(), os.environ['REGION'].strip(), os.environ['LIST']
          print('原始區域長度', len(region), '金鑰長度', len(key))
          r = region.lower()
          if '://' in r: r = r.split('://', 1)[1]
          r = r.split('/')[0].split('.')[0].replace(' ', '').replace('-', '').replace('(', '').replace(')', '')
          region = r
          if not region: print('AZURE_SPEECH_REGION 是空的：請到 Settings → Secrets 重新填，例如 eastasia'); sys.exit(1)
          if not key: print('AZURE_SPEECH_KEY 是空的'); sys.exit(1)
          if len(region) > 30 or not region.isalnum(): print('AZURE_SPEECH_REGION 填錯了（看起來像金鑰）：請改成區域名稱，例如 eastasia'); sys.exit(1)
          print('區域長度', len(region))
          SAMPLE = [
            ["s01", "zh-TW-HsiaoChenNeural", "zh-TW", "小貓要過馬路，看到紅燈亮了。牠應該怎麼做呢？", "-5%", "0%", "旁白／題目（曉臻）"],
            ["s02", "zh-TW-HsiaoYuNeural", "zh-TW", "小貓要過馬路，看到紅燈亮了。牠應該怎麼做呢？", "-5%", "0%", "旁白／題目（曉雨）"],
            ["s03", "zh-TW-YunJheNeural", "zh-TW", "小貓要過馬路，看到紅燈亮了。牠應該怎麼做呢？", "-5%", "0%", "旁白／題目（雲哲）"],
            ["s04", "zh-TW-HsiaoYuNeural", "zh-TW", "等紅燈變綠燈再走。", "0%", "0%", "念答案（曉雨）"],
            ["s05", "zh-TW-HsiaoChenNeural", "zh-TW", "答對了！你好棒！", "0%", "+5%", "答對鼓勵（曉臻）"],
            ["b1", "zh-TW-YunJheNeural", "zh-TW", "我是寶哥！我最喜歡跑步！", "+5%", "+15%", "寶哥：台灣腔（雲哲調高）"],
            ["b1c", "zh-CN-YunxiaNeural", "zh-CN", "我是寶哥！我最喜歡跑步！", "0%", "0%", "寶哥：真的小男孩聲（雲夏，較大陸腔）"],
            ["g1", "zh-TW-HsiaoYuNeural", "zh-TW", "我是筑筑，我喜歡畫畫。", "-5%", "+20%", "筑筑：台灣腔（曉雨調高）"],
            ["g1c", "zh-CN-XiaoshuangNeural", "zh-CN", "我是筑筑，我喜歡畫畫。", "0%", "0%", "筑筑：真的小女孩聲（曉雙，較大陸腔）"],
            ["mom", "zh-TW-HsiaoYuNeural", "zh-TW", "我是媽媽，我最愛你們了，有什麼事都可以跟我說。", "-5%", "0%", "媽媽（曉雨）"],
            ["tch", "zh-TW-HsiaoChenNeural", "zh-TW", "我是林老師，歡迎來到動動腦小學堂，我們一起學習吧！", "-8%", "-3%", "林老師（曉臻，慢一點）"],
            ["dad", "zh-TW-YunJheNeural", "zh-TW", "我是爸爸，週末我們一起去公園玩吧！", "-5%", "-8%", "爸爸（雲哲調低）"],
            ["b2", "zh-TW-YunJheNeural", "zh-TW", "我是小安，我最愛看書，有不會的問題可以問我！", "-3%", "+8%", "小安（雲哲）"],
            ["g2", "zh-TW-HsiaoChenNeural", "zh-TW", "我是米米！我愛唱歌，我們一起唱首歌吧！", "+8%", "+18%", "米米（曉臻調高、快一點）"],
            ["jin", "zh-TW-HsiaoYuNeural", "zh-TW", "小朋友，跟阿姨走，我帶你去買玩具喔！", "-10%", "-8%", "金阿姨（壞人）"],
            ["ma", "zh-TW-HsiaoChenNeural", "zh-TW", "小朋友，婆婆這裡有糖果，不要跟爸媽說喔！", "-18%", "-22%", "馬婆婆（壞人）"],
            ["niu", "zh-TW-YunJheNeural", "zh-TW", "小朋友，我的小狗不見了，上車幫我找好不好？", "-10%", "-18%", "牛叔叔（壞人）"],
            ["en1", "en-US-AnaNeural", "en-US", "Apple. A is for apple.", "-10%", "0%", "英文單字（Ana 小女孩）"],
            ["en2", "en-US-JennyNeural", "en-US", "Stand up, please.", "-10%", "0%", "教室英語（Jenny 老師）"],
            ["m1", "zh-TW-HsiaoChenNeural", "zh-TW", "三加四，等於幾？", "-5%", "0%", "數學題（曉臻）"]
          ]
          if lst == 'sample':
            items, out = SAMPLE, 'audio/sample'
          else:
            items, out = json.load(open('audio/lines.json', encoding='utf-8')), 'audio/v'
          os.makedirs(out, exist_ok=True)
          url = f'https://{region}.tts.speech.microsoft.com/cognitiveservices/v1'
          made = skip = fail = 0
          for it in items:
            fid, voice, lang, text, rate, pitch = it[:6]
            fn = f'{out}/{fid}.mp3'
            if os.path.exists(fn): skip += 1; continue
            ssml = f'<speak version="1.0" xml:lang="{lang}"><voice name="{voice}"><prosody rate="{rate}" pitch="{pitch}">{html.escape(text)}</prosody></voice></speak>'
            for k in range(4):
              try:
                req = urllib.request.Request(url, data=ssml.encode('utf-8'), headers={'Ocp-Apim-Subscription-Key': key, 'Content-Type': 'application/ssml+xml', 'X-Microsoft-OutputFormat': 'audio-24khz-48kbitrate-mono-mp3', 'User-Agent': 'ddn-tts'})
                open(fn, 'wb').write(urllib.request.urlopen(req, timeout=60).read()); made += 1; break
              except urllib.error.HTTPError as e:
                print('HTTP', e.code, fid, e.read()[:200])
                if e.code in (401, 403): print('金鑰或區域不對：請確認 AZURE_SPEECH_KEY 和 AZURE_SPEECH_REGION'); sys.exit(1)
                if e.code == 400: break
                time.sleep(3 * (k + 1))
              except Exception as e:
                print('retry', fid, e); time.sleep(3 * (k + 1))
            else:
              fail += 1
            time.sleep(0.25)
          if lst == 'sample':
            rows = ''.join(f'<li><b>{html.escape(i[6])}</b><br>{html.escape(i[3])}<br><audio controls preload="none" src="{i[0]}.mp3"></audio></li>' for i in SAMPLE)
            open(f'{out}/index.html', 'w', encoding='utf-8').write(f'<!doctype html><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AI 語音試聽</title><body style="font-family:sans-serif;max-width:640px;margin:20px auto;padding:0 16px;line-height:1.6"><h1>AI 語音試聽</h1><ol>{rows}</ol></body>')
          print(f'made {made}, skipped {skip}, failed {fail}', )
          if fail and not made: sys.exit(1)
          PY
          python3 /tmp/gen.py
      - name: 存回網站
        run: |
          git config user.name "tts-bot"
          git config user.email "tts-bot@users.noreply.github.com"
          git add audio
          git diff --cached --quiet || git commit -m "AI 語音音檔 (${{ github.event.inputs.list }})"
          git push
